name: Linux binary gems

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and extend
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: linux-gems-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    # Build against glibc 2.36 rather than the host runner's newer libc.
    container: ruby:4.0-bookworm
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hailer
          POSTGRES_PASSWORD: hailer-test
          POSTGRES_DB: hailer_test
        options: >-
          --health-cmd "pg_isready -U hailer -d hailer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      BUNDLE_FROZEN: "true"
      BUNDLE_PATH: vendor/bundle
      BUNDLE_FORCE_RUBY_PLATFORM: "true"
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ inputs.tag }}
      HAILER_TEST_DATABASE_URL: postgres://hailer:hailer-test@postgres:5432/hailer_test
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Check release version and install build dependencies
        run: |
          ruby -Ilib -rhailer/version -e 'tag = ENV.fetch("RELEASE_TAG"); abort "tag/version mismatch" unless tag.empty? || tag == "v#{Hailer::VERSION}"'
          apt-get update
          apt-get install -y --no-install-recommends cmake pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99"
      - name: Install locked Ruby dependencies
        run: |
          version=$(ruby -e 'puts File.read("Gemfile.lock").split("BUNDLED WITH").last.strip')
          gem install bundler --version "$version" --no-document
          # The initial tag has empty checksum entries. Populate those from
          # RubyGems without changing locked versions, then install frozen.
          cp Gemfile.lock /tmp/hailer-original.lock
          BUNDLE_FROZEN=false bundle lock --add-checksums
          ruby -rbundler -e '
            parse = ->(path) { Bundler::LockfileParser.new(File.read(path)).specs.map { |s| [s.name, s.version, s.platform] } }
            abort "locked dependencies changed" unless parse.call("/tmp/hailer-original.lock") == parse.call("Gemfile.lock")
          '
          bundle install
      - name: Test and package
        run: |
          ruby -Ilib -rhailer/binary -e 'abort "unexpected host" unless Hailer::Binary.platform == ENV.fetch("EXPECTED_PLATFORM")'
          bundle exec rake test
          cargo test --release --locked
          bundle exec rake native:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hailer-${{ matrix.platform }}
          path: pkg/hailer-*-${{ matrix.platform }}.gem
          if-no-files-found: error
          retention-days: 7

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    # Prove the artifact runs without the build image's toolchain/libraries.
    container: ruby:4.0-slim-bookworm
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hailer
          POSTGRES_PASSWORD: hailer-test
          POSTGRES_DB: hailer_test
        options: >-
          --health-cmd "pg_isready -U hailer -d hailer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    timeout-minutes: 20
    env:
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ inputs.tag }}
      HAILER_DATABASE_URL: postgres://hailer:hailer-test@postgres:5432/hailer_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hailer-${{ matrix.platform }}
          path: pkg
      - name: Install binary gem and exercise PostgreSQL CLI
        run: |
          gem install pkg/hailer-*-"$EXPECTED_PLATFORM".gem --no-document
          ruby -rhailer/binary -e 'abort "wrong installed platform" unless Gem.loaded_specs.fetch("hailer").platform.to_s == ENV.fetch("EXPECTED_PLATFORM")'
          version=$(ruby -Ilib -rhailer/version -e 'puts Hailer::VERSION')
          test "$(hailer --version)" = "hailer $version"
          binary=$(ruby -rhailer/binary -e 'puts Hailer::Binary.path')
          ldd "$binary"
          hailer migrate
          hailer import-suppressions --file test/fixtures/suppressions.json > /tmp/import.json
          ruby -rjson -e 'abort "import failed" unless JSON.parse(File.read("/tmp/import.json")).fetch("imported") == 2'

  attach:
    if: github.event_name == 'workflow_dispatch'
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hailer-*-linux-gnu
          merge-multiple: true
          path: new
      - name: Extend release without replacing existing gems
        shell: bash
        run: |
          set -euo pipefail
          mkdir existing combined
          gh release download "$RELEASE_TAG" --dir existing --pattern '*.gem' --pattern SHA256SUMS
          (cd existing && sha256sum --check SHA256SUMS)
          for gem in new/*.gem; do
            name=$(basename "$gem")
            if [[ -f "existing/$name" ]]; then
              cmp "$gem" "existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$gem"
            fi
          done
          cp existing/*.gem combined/
          cp new/*.gem combined/
          (cd combined && sha256sum -- *.gem > SHA256SUMS)
          gh release upload "$RELEASE_TAG" combined/SHA256SUMS --clobber
