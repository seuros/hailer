[workspace]

[package]
name = "hailer"
version = "0.7.1"
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
description = "Outbound mail delivery ship for Mothership: SES or Postmark sender"
license = "BSD-3-Clause"
repository = "https://github.com/seuros/hailer"

[[bin]]
name = "hailer"
path = "src/main.rs"

[features]
ses = ["dep:base64"]
postmark = ["dep:mail-parser", "dep:base64"]

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
mothership-docking-protocol = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"] }
rama = { version = "0.4", features = ["http-backend", "dns", "tcp", "rustls", "ring"] }
mail-parser = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }
email_address = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
bytes = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
usage-rs = "7"
anyhow = "1"
thiserror = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
breaker-machines = { version = "0.21", features = ["async"] }
chrono-machines = "0.10"
throttle-machines = "0.4"
behavior-machines = "0.2"
behavior-machines-circuit = "0.3"
state-machines = { version = "0.33", features = ["dynamic", "serde"] }
deadline-machines = "0.2"
supervisor-machines = "0.3"
rogue-machines = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
dead_code_pub_in_binary = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
significant_drop_tightening = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
