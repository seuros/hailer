# Set HAILER_DATABASE_URL separately; do not commit credentials.
threads = 2
database_pool_size = 5
shutdown_timeout_seconds = 30

# Optional SES event-publishing configuration set. Its events must include mail
# tags and reach the dedicated SNS/SQS feedback route to resolve unknown sends.
# Otherwise configure an appropriate default set on the sending identity.
# ses_configuration_set = "hailer-feedback"

# Opt in: initial AWS account/region sync gates send readiness.
[suppression_sync]
interval_seconds = 3600

# Optional PER-PROCESS budget, not an account-wide SES quota.
# [rate_limit]
# recipients_per_second = 10.0
# burst = 50

# In development: durable intake requires explicit logical payload budgets.
# Requires the durable-dispatch build, not the existing 0.2 release candidates.
# [queued]
# max_bytes = 268435456
# max_messages = 10000
# unknown_retention_seconds = 604800

[feedback]
# Dedicated queue; subscribe the SNS topic with RawMessageDelivery=false.
queue_url = "https://sqs.us-east-1.amazonaws.com/123456789012/hailer-feedback"
topic_arn = "arn:aws:sns:us-east-1:123456789012:mail-feedback"

# Opt in: pre-send deliverability check (Emailable today; the provider is a
# swappable enum, not hardcoded). Set EMAILABLE_API_KEY separately - never
# here. Verdicts are cached (hailer.address_verifications) so a retry of the
# same address does not pay for a second lookup.
# [email_verification]
# provider = "emailable"
# reject_states = ["undeliverable"]  # risky/unknown fail open by default
# cache_ttl_seconds = 604800
# timeout_seconds = 5

# Opt in, queued pipeline only: hold a message for operator review
# (hailer release-quarantine / cancel-message) instead of a hard reject.
# A non-ASCII recipient domain is always checked regardless of this block;
# this only adds the RDAP new-domain check. No credential needed - RDAP's
# bootstrap registry is public.
# [domain_intel]
# provider = "rdap"
# new_domain_threshold_days = 30
